# Bundle patch for the web-url-view plugin: inserts its plugin row into the
# web profile composition. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
#   dsh plugin --profile web add link:<repo path>
# or by adding the package to the profile's dependency/bundle lists.
- insert:
    - id: web-url-view
      name: dsh-web-url-view
